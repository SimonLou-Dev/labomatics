name: Build Docker Images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_suffix:
        required: false
        type: string
        default: ""

jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: worker
            context: backend
            file: backend/Dockerfile.worker
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image repository
        run: echo "IMAGE_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/labomatics-${{ matrix.name }}:v${{ inputs.version }}${{ inputs.tag_suffix }}
            ghcr.io/${{ env.IMAGE_REPO }}/labomatics-${{ matrix.name }}:latest${{ inputs.tag_suffix }}
          build-args: ${{ matrix.name == 'frontend' && format('VITE_PRIMEUI_LICENSE_KEY={0}', secrets.VITE_PRIMEUI_LICENSE_KEY) || '' }}
