name: Release

on:
  workflow_call:
    inputs:
      github_ref:
        required: true
        type: string
      github_token:
        required: false
        type: string
    outputs:
      released:
        value: ${{ jobs.semantic-release.outputs.released }}
      version:
        value: ${{ jobs.semantic-release.outputs.version }}

permissions:
  contents: write
  id-token: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git & Debug
        run: |
          echo "=== Git Configuration ==="
          git config --global url."https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global pull.rebase true
          echo "User: $(git config --global user.name)"
          echo "Email: $(git config --global user.email)"
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "Token type: $(echo $GITHUB_TOKEN | head -c 20)..."
          git config --global --list | grep url
        env:
          GITHUB_TOKEN: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release (Verbose)
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}
          PSR_LOGGING_LEVEL: DEBUG

      - name: Show Commit Info
        if: always()
        run: |
          echo "=== Last Commit Info ==="
          git log -1 --format="Author: %an <%ae>"
          git log -1 --format="Committer: %cn <%ce>"
          git log -1 --format="Subject: %s"
          git log -1 --oneline
        env:
          GITHUB_TOKEN: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}
