name: Release

on:
  workflow_call:
    inputs:
      github_ref:
        required: true
        type: string
      github_token:
        required: false
        type: string
    outputs:
      released:
        value: ${{ jobs.semantic-release.outputs.released }}
      version:
        value: ${{ jobs.semantic-release.outputs.version }}

permissions:
  contents: write
  id-token: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config --global url."https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "labomatics-release[bot]"
          git config --global user.email "labomatics-release[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}
          git_committer_name: "labomatics-release[bot]"
          git_committer_email: "labomatics-release[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ inputs.github_token || secrets.GITHUB_TOKEN }}
