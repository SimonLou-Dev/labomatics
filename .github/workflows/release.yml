name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.PAT_SEMANTIC_RELEASE }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"
        env:
          SKIP_BUILD: ${{ github.ref != 'refs/heads/main' }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pip install poetry

      - name: Build package
        working-directory: cli
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: worker
            context: backend
            file: backend/Dockerfile.worker
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/labomatics-${{ matrix.name }}:v${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/labomatics-${{ matrix.name }}:latest

  sync-dev:
    name: Sync dev to main
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SEMANTIC_RELEASE }}

      - name: Reset dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout dev
          git reset --hard origin/main
          git push --force origin dev
