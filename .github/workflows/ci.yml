name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-backend:
    name: Lint backend (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install

      - name: ruff check
        working-directory: backend
        run: poetry run ruff check .

      - name: ruff format check
        working-directory: backend
        run: poetry run ruff format --check .

      - name: mypy
        working-directory: backend
        run: poetry run mypy labomatics --ignore-missing-imports

  lint-cli:
    name: Lint CLI (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: cli
        run: poetry install

      - name: ruff check
        working-directory: cli
        run: poetry run ruff check .

      - name: ruff format check
        working-directory: cli
        run: poetry run ruff format --check .

      - name: mypy
        working-directory: cli
        run: poetry run mypy labomatics_cli --ignore-missing-imports

  lint-frontend:
    name: Lint frontend (eslint + vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check
