name: Dev Build

on:
  push:
    branches: [dev]

permissions:
  contents: write
  packages: write

jobs:
  release-rc:
    name: Semantic Release (RC)
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SEMANTIC_RELEASE || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.PAT_SEMANTIC_RELEASE || github.token }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: release-rc
    if: needs.release-rc.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: worker
            context: backend
            file: backend/Dockerfile.worker
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/labomatics-${{ matrix.name }}:rc-${{ needs.release-rc.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/labomatics-${{ matrix.name }}:latest-rc
