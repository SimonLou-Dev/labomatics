version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labomatics-postgres
    environment:
      POSTGRES_USER: labomatics
      POSTGRES_PASSWORD: labomatics
      POSTGRES_DB: labomatics
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labomatics']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labomatics-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # keycloak:
