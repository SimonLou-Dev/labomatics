[tool.poetry]
name = "medbox"
version = "0.1.0"
description = "labOmatics"
authors = ["Simon"]
packages = [{ include = "labomatics" }]

[tool.poetry.dependencies]
python = "^3.11"

requests = "^2.32"
pyyaml = "^6.0"
proxmoxer = "^2.0"

# Core API
fastapi = "^0.115"
uvicorn = { version = "^0.31", extras = ["standard"] }

# Auth / Keycloak
python-jose = "^3.5"
authlib = "^1.3"
python-keycloak = "^4.0"

# ORM / Database
SQLAlchemy = "^2.0.51"
asyncpg = "^0.31"
alembic = "^1.18"
psycopg2-binary = "^2.9"

# Schemas / Validation
pydantic = { extras = ["email"], version = "^2.10" }
pydantic-settings = "^2.6"

# Security / Crypto
cryptography = "^44.0"
passlib = { version = "^1.7", extras = ["bcrypt"] }

# Logging
structlog = "^24.4"

# Async Utils
aiohttp = "^3.10"
httpx = "^0.28"
redis = "^5.2"
tenacity = "^8.3"


# Task Queue
celery = { version = "^5.4", extras = ["redis"] }
aioboto3 = "^15.5"
python-multipart = "^0.0.22"
aiomqtt = "^2.5"
cachetools = "^7.1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
ruff = "^0.8"
aiosqlite = "^0.20"
wheel = "^0.44"
mypy = "^1.14"

[tool.poetry.scripts]
api = "labomatics.api.main:run"
api-dev = "labomatics.api.main:run_dev"
scheduler-worker = "labomatics.worker.__main__:run"

# ============================================================================
# RUFF CONFIGURATION
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (sécurité)
    "T20",   # flake8-print
]

ignore = [
    "E501",   # line too long (géré par le formateur)
    "B008",   # function calls in argument defaults (normal avec FastAPI)
    "S101",   # use of assert (utile pour les tests)
    "ARG001", # unused function argument
    "ARG002", # unused method argument (courant pour les dépendances FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["medbox"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"