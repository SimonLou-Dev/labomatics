# Alembic Configuration
# ========================================

[alembic]
sqlalchemy.url = postgresql://labomatics:labomatics@localhost/labomatics
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.max_identifier_length = 63
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
