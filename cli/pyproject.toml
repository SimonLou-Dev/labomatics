[tool.poetry]
name = "labomatics-cli"
version = "0.4.1-rc.5"
description = "Orchestration centrale pour labomatics"
authors = ["SimonLou-Dev <simon.bidet@pm.me>"]
license = "AGPL-3.0"
readme = "README.md"
packages = [{include = "labomatics_cli"}]

[tool.poetry.dependencies]
python = "^3.10"
rich = "^13.0"
pydantic = "^2.0"
requests = "^2.31"
paramiko = "^3.0"
jinja2 = "^3.0"
pyyaml = "^6.0"
proxmoxer = "^2.0"
readchar = "^4.2.2"
prompt-toolkit = "^3.0"
ldap3 = "^2.9.1"

[tool.poetry.scripts]
labomatics = "labomatics_cli.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
ruff = "^0.1"
mypy = "^1.0"
types-pyyaml = "^6.0.12.20260906"
types-ldap3 = "^2.9.13.20260827"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
