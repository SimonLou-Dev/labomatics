# dnsmasq configuration
listen-address=0.0.0.0
port=53
bind-interfaces

# Local zones
address=/keycloak.{{ DOMAIN }}/{{ VM_WAN_IP }}
address=/ns.{{ DOMAIN }}/{{ VM_WAN_IP }}

# Proxmox nodes FQDNs
{{ NODE_DNS_ENTRIES }}

# Upstream DNS for external queries
{{ DNS_SERVERS }}

# Cache
cache-size=1000

# Log
log-queries
log-facility=-
